<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline algorithm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,600;0,6..72,700;1,6..72,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#F1F3F6; --surface:#FFFFFF; --ink:#141821; --ink-soft:#565F6B; --rule:#DBE0E6;
    --a:#2F6FED; --a-bg:#DCE7FD; --a-faint:#B7CDF9;
    --b:#E0434B; --b-bg:#FBDEDF;
    --ab:#7C3FD6; --ab-bg:#EBE0FA;
    --good:#1E8F5F; --good-bg:#DCF2E6;
    --warn:#9A6B0A; --warn-bg:#F3E7C9;
    --shadow:0 1px 2px rgba(20,24,33,.06), 0 8px 24px -10px rgba(20,24,33,.18);
    --font-d:'Newsreader',Georgia,serif; --font-b:'Public Sans',-apple-system,sans-serif; --font-m:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#111318; --surface:#181B21; --ink:#E7EAEE; --ink-soft:#A2A9B3; --rule:#2A2F37;
      --a:#6C9CF7; --a-bg:#1B2740; --a-faint:#33436B;
      --b:#F0787D; --b-bg:#3A1E20;
      --ab:#B18AF0; --ab-bg:#2B1F3F;
      --good:#5FCB94; --good-bg:#173226;
      --warn:#D9AC4E; --warn-bg:#3A2F16;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -10px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-b); margin:0; padding:24px 18px;}
  .wrap{max-width:680px; margin:0 auto;}

  .card{background:var(--surface); border:1px solid var(--rule); border-radius:16px; padding:24px clamp(18px,4vw,32px); margin:0; box-shadow:var(--shadow);}
  .card h2{font-family:var(--font-d); font-size:23px; font-weight:700; margin:0 0 2px;}
  .stdtag{font-family:var(--font-m); font-size:11px; margin-bottom:18px;}
  .stdtag.found{color:var(--good);}

  /* --- flow: problem -> transform(s) -> solution --- */
  .flow{background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:18px; display:flex; flex-direction:column; align-items:center;}
  .frame{width:100%; display:flex; justify-content:center;}
  .frame-inner{width:100%; max-width:560px;}
  .frame-tag{
    font-family:var(--font-m); font-size:11px; font-weight:700; letter-spacing:.04em;
    color:var(--surface); background:var(--ink-soft); border-radius:20px; padding:2px 10px;
    display:block; width:fit-content; margin:0 auto 8px;
  }
  .frame-tag.solved{background:var(--good);}
  .flow-arrow{color:var(--rule); font-size:20px; line-height:1; margin:6px 0; font-family:var(--font-m);}

  .filelink{margin-top:14px; font-size:11px; color:var(--ink-soft); font-family:var(--font-m); text-align:center;}

  /* --- footer: QR to the repository (every visualization carries it, principle 10) --- */
  .repo{margin-top:16px; padding-top:14px; border-top:1px dashed var(--rule); display:flex; align-items:center; justify-content:center; gap:14px;}
  .repo svg{width:72px; height:72px; color:var(--ink); flex-shrink:0; background:var(--surface);}
  .repo .repo-txt{font-family:var(--font-m); font-size:11px; color:var(--ink-soft); line-height:1.5;}
  .repo .repo-txt b{display:block; color:var(--ink); font-weight:600;}

  .ans{background:var(--good-bg); color:var(--good); padding:2px 10px; border-radius:6px; font-weight:700;}
  .ans-big{display:block; text-align:center; font-family:var(--font-m); font-size:36px; font-weight:700; background:var(--good-bg); color:var(--good); border-radius:12px; padding:14px 10px; margin:0 auto; max-width:170px;}

  /* --- examples/offline-algorithm.css --- */
.of-col{display:flex; flex-direction:column; align-items:center; gap:10px;}
.of-lane{display:flex; align-items:center; gap:7px;}
.of-tile{min-width:46px; height:34px; padding:0 9px; display:flex; align-items:center; justify-content:center;
  border:1.5px solid var(--a); border-radius:7px; background:var(--a-bg); color:var(--a);
  font-family:var(--font-m); font-size:14px; font-weight:700;}
.of-tile.of-hidden{border-style:dashed; border-color:var(--b); background:var(--b-bg); color:var(--b);}
.of-tile.of-ans{border-color:var(--good); background:var(--good-bg); color:var(--good);}
.of-tile.of-held{border-style:dashed; border-color:var(--rule); background:var(--paper); color:var(--ink-soft);}
.of-step{font-family:var(--font-m); font-size:14px; font-weight:700; color:var(--ink-soft); line-height:1;}
.of-cut{width:1px; height:36px; border-left:2px dashed var(--b);}
.of-badges{display:flex; align-items:center; gap:7px;}
.of-badge{font-family:var(--font-m); font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; white-space:nowrap;}
.of-badge.bad{background:var(--b-bg); color:var(--b);}
.of-badge.good{background:var(--good-bg); color:var(--good);}
.of-badge.soft{background:var(--paper); color:var(--ink-soft); border:1px solid var(--rule);}

.of-bar-wrap{width:420px; padding-top:14px;}
.of-bar{position:relative; height:26px; border:1.5px solid var(--good); border-radius:6px; background:var(--good-bg);}
.of-tick{position:absolute; top:-9px; bottom:-9px; width:2px; background:var(--good);}
.of-tick-lab{position:absolute; top:-27px; transform:translateX(-50%);
  font-family:var(--font-m); font-size:11px; font-weight:700; color:var(--good);}
.of-zero{font-family:var(--font-m); font-size:11px; font-weight:700; color:var(--ink-soft); margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <h2>Offline algorithm</h2>
    <div class="stdtag found">✓ Whole batch before the first answer</div>
    <div class="flow">
<!-- examples/offline-algorithm.html -->
<div class="frame-tag">?</div>
<div class="frame"><div class="frame-inner">
  <div class="of-col">
    <div class="of-lane">
      <div class="of-tile">12</div>
      <div class="of-step">&rarr;</div>
      <div class="of-tile of-ans">&#10003;</div>
      <div class="of-cut"></div>
      <div class="of-tile of-hidden">?</div>
      <div class="of-tile of-hidden">?</div>
    </div>
    <div class="of-badges"><span class="of-badge bad">max unknown</span></div>
  </div>
</div></div>

<div class="flow-arrow">↓</div>
<div class="frame-tag">read all</div>
<div class="frame"><div class="frame-inner">

    <div class="of-lane">
      <div class="of-tile">12</div>
      <div class="of-tile">30</div>
      <div class="of-tile">7</div>
      <div class="of-cut"></div>
      <div class="of-tile of-held">&#10003;</div>
      <div class="of-tile of-held">&#10003;</div>
      <div class="of-tile of-held">&#10003;</div>
    </div>
    <div class="of-badges">
      <span class="of-badge soft">held</span>
      <span class="of-badge good">max 30</span>
    </div>
  </div>
</div></div>

<div class="flow-arrow">↓</div>
<div class="frame-tag solved">=</div>
<div class="frame"><div class="frame-inner">
  <div class="of-col">
    <div class="of-bar-wrap">
      <div class="of-bar">
        <span class="of-tick" style="left:23.3%"></span><span class="of-tick-lab" style="left:23.3%">7</span>
        <span class="of-tick" style="left:40%"></span><span class="of-tick-lab" style="left:40%">12</span>
        <span class="of-tick" style="left:calc(100% - 2px)"></span><span class="of-tick-lab" style="left:100%">30</span>
      </div>
    </div>
    <div class="of-lane">
      <div class="of-tile of-ans">12 &#10003;</div>
      <div class="of-tile of-ans">30 &#10003;</div>
      <div class="of-tile of-ans">7 &#10003;</div>
    </div>
    <div class="of-badges"><span class="of-badge good">1 build</span></div>
  </div>
</div></div>
